# A generic Alembic configuration tuned for ProCuGents.
#
# Usage:
#   alembic upgrade head            # apply pending migrations
#   alembic downgrade -1            # roll back one revision
#   alembic revision --autogenerate -m "msg"  # NOTE: only works for SQLite;
#                                              # for PostgreSQL, write revisions
#                                              # by hand and review them.
#
# The DATABASE_URL is sourced from POSTGRES_* env vars (via
# src.services.database._get_database_url). When those are unset the engine
# falls back to a local SQLite file.

[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
# `sqlalchemy.url` is intentionally left blank -- env.py reads DATABASE_URL
# from ``src.services.database`` so we have a single source of truth.
sqlalchemy.url =
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s
timezone = UTC
truncate_slug_length = 40
revision_environment = false

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
